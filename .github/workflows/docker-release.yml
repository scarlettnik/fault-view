name: Docker release

on:
  push:
    tags:
      - 'docker-v*'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Build and publish the offline images
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          npm run bundle:docker
          revision=$(git rev-parse --short=12 HEAD)
          mv "dist/faultview-linux-amd64-$revision.tar.gz" dist/faultview-linux-amd64.tar.gz
          cd dist
          sha256sum faultview-linux-amd64.tar.gz > faultview-linux-amd64.tar.gz.sha256
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "FaultView $GITHUB_REF_NAME" \
            --notes 'Готовые Docker-образы для Linux x86-64.' \
            faultview-linux-amd64.tar.gz faultview-linux-amd64.tar.gz.sha256
