name: Quality and Pages

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Verify FaultView
    runs-on: ubuntu-24.04
    concurrency:
      group: quality-${{ github.ref }}
      cancel-in-progress: true
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: faultview_test
          POSTGRES_USER: faultview
          POSTGRES_PASSWORD: ci_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U faultview -d faultview_test"
          --health-interval 5s --health-timeout 3s --health-retries 12
      s3:
        image: chrislusf/seaweedfs:4.54
        env:
          AWS_ACCESS_KEY_ID: faultview_ci
          AWS_SECRET_ACCESS_KEY: faultview_ci_test_only
          S3_BUCKET: faultview-test
        ports:
          - 8333:8333
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            apps/frontend/package-lock.json
            apps/backend/package-lock.json
            apps/landing/package-lock.json
            examples/package-lock.json
      - run: npm run setup
      - run: npm --prefix apps/frontend exec -- playwright install --with-deps chromium
      - run: npm run verify
        env:
          SITE_BASE_PATH: /${{ github.event.repository.name }}/
          STORYBOOK_DISABLE_TELEMETRY: '1'
      - name: Verify API and browser workflow with PostgreSQL and S3
        env:
          TEST_DATABASE_URL: postgresql://faultview:ci_test_password@127.0.0.1:5432/faultview_test
          FAULTVIEW_S3_TEST_BUCKET: faultview-test
          FAULTVIEW_S3_ENDPOINT: http://127.0.0.1:8333
          FAULTVIEW_S3_PATH_STYLE: 'true'
          AWS_REGION: us-east-1
          AWS_ACCESS_KEY_ID: faultview_ci
          AWS_SECRET_ACCESS_KEY: faultview_ci_test_only
        run: |
          npm run test:api
          npm run test:e2e:full
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results
          path: |
            apps/frontend/test-results
            apps/frontend/playwright-report
            examples/test-results
          retention-days: 7
      - uses: actions/upload-pages-artifact@v4
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: site-dist

  deploy:
    name: Publish Pages
    needs: quality
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - uses: actions/deploy-pages@v4
        id: deployment
      - name: Check published applications
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          for path in "" "app/" "storybook/" "storybook/iframe.html" \
            "examples/" "examples/storefront/" "examples/petclinic/" "examples/conduit/" \
            "examples/todo/" "examples/robot-shop/" "examples/react-express-mongodb/"; do
            curl --fail --silent --show-error --location \
              --retry 5 --retry-all-errors --retry-delay 5 \
              --connect-timeout 10 --max-time 30 \
              --output /dev/null "${SITE_URL%/}/$path"
          done
