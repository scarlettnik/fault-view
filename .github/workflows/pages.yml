name: Quality and Pages

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Verify frontend MVP
    runs-on: ubuntu-24.04
    concurrency:
      group: quality-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            apps/frontend/package-lock.json
            apps/landing/package-lock.json
      - run: npm run setup
      - run: npm --prefix apps/frontend exec -- playwright install --with-deps chromium
      - run: npm run verify
        env:
          SITE_BASE_PATH: /${{ github.event.repository.name }}/
          STORYBOOK_DISABLE_TELEMETRY: '1'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results
          path: |
            apps/frontend/test-results
            apps/frontend/playwright-report
          retention-days: 7
      - uses: actions/upload-pages-artifact@v4
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: site-dist

  deploy:
    name: Publish Pages
    needs: quality
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - uses: actions/deploy-pages@v4
        id: deployment
      - name: Check published applications
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          for path in "" "app/" "storybook/" "storybook/iframe.html"; do
            curl --fail --silent --show-error --location \
              --retry 5 --retry-all-errors --retry-delay 5 \
              --connect-timeout 10 --max-time 30 \
              --output /dev/null "${SITE_URL%/}/$path"
          done
