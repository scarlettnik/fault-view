name: Lint and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  pages:
    runs-on: ubuntu-latest
    concurrency: pages-${{ github.ref }}
    environment:
      name: ${{ github.event_name == 'push' && 'github-pages' || 'checks' }}
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - if: github.event_name == 'push'
        run: |
          mkdir -p "${{ runner.temp }}/site"
          cp -R index.html styles scripts assets "${{ runner.temp }}/site/"
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name == 'push'
        with:
          path: ${{ runner.temp }}/site
      - uses: actions/deploy-pages@v4
        if: github.event_name == 'push'
        id: deployment
